# Deploy only the API and its continuously running worker. Deploy apps/web to Vercel.
# Review the paid worker and S3 requirements in README.md before syncing.
services:
  - type: web
    name: wildmon-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: uv sync --locked --no-dev
    startCommand: .venv/bin/python -m scripts.seed && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: wildmon
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: STORAGE_MODE
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: GEMMA_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GEMMA_MODEL
        value: gemma-4-31b-it
      - key: GEMMA_API_KEY
        sync: false
      - key: BACKBOARD_KEY
        sync: false

  - type: worker
    name: wildmon-worker
    runtime: python
    plan: 0.5c-512mb
    rootDir: apps/api
    buildCommand: uv sync --locked --no-dev
    startCommand: .venv/bin/python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: MONGODB_URI
        fromService:
          name: wildmon-api
          type: web
          envVarKey: MONGODB_URI
      - key: MONGODB_DATABASE
        value: wildmon
      - key: STORAGE_MODE
        value: s3
      - key: S3_BUCKET
        fromService:
          name: wildmon-api
          type: web
          envVarKey: S3_BUCKET
      - key: S3_ENDPOINT_URL
        fromService:
          name: wildmon-api
          type: web
          envVarKey: S3_ENDPOINT_URL
      - key: S3_ACCESS_KEY_ID
        fromService:
          name: wildmon-api
          type: web
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          name: wildmon-api
          type: web
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: S3_REGION
        fromService:
          name: wildmon-api
          type: web
          envVarKey: S3_REGION
      - key: GEMMA_BASE_URL
        fromService:
          name: wildmon-api
          type: web
          envVarKey: GEMMA_BASE_URL
      - key: GEMMA_MODEL
        fromService:
          name: wildmon-api
          type: web
          envVarKey: GEMMA_MODEL
      - key: GEMMA_API_KEY
        fromService:
          name: wildmon-api
          type: web
          envVarKey: GEMMA_API_KEY
      - key: BACKBOARD_KEY
        fromService:
          name: wildmon-api
          type: web
          envVarKey: BACKBOARD_KEY

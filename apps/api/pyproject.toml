[project]
name = "wildmon-api"
version = "0.1.0"
description = "Wildmon game API and Gemma inference worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "pydantic-settings>=2.7",
  "pymongo>=4.11",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.10",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "httpx>=0.28",
  "pillow>=11.0",
  "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

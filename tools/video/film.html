<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>Wildmon — Find more outside</title>
    <style>
      @font-face {
        font-family: Geist;
        src: url('assets/geist.woff2');
      }
      @font-face {
        font-family: Geist;
        src: url('assets/geist-bold.woff2');
        font-weight: 700;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f6f4e9;
        color: #173c2d;
        font-family: Geist, sans-serif;
      }
      #film {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      .layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .brand {
        z-index: 10;
        position: absolute;
        left: 76px;
        top: 46px;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -3px;
      }
      .brand b {
        color: #e26c48;
      }
      .edition {
        z-index: 10;
        position: absolute;
        right: 76px;
        top: 62px;
        font-size: 17px;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .eyebrow {
        font-size: 18px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #697668;
      }
      .heading {
        font-size: 66px;
        line-height: 1.02;
        letter-spacing: -3.6px;
        font-weight: 700;
        margin: 17px 0 30px;
      }
      .body {
        font-size: 26px;
        line-height: 1.45;
        letter-spacing: -0.5px;
        color: #607067;
      }
      .rail {
        position: absolute;
        left: 76px;
        top: 220px;
        width: 296px;
      }
      .rail .heading {
        font-size: 46px;
        letter-spacing: -2.9px;
        line-height: 1.08;
      }
      .rail .body {
        font-size: 23px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 13px;
        margin: 28px 0;
        font-size: 23px;
      }
      .step i {
        font-style: normal;
        font-size: 16px;
        border: 1px solid #b6c9b8;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
      }
      .step.active {
        color: #d65632;
        font-weight: 700;
      }
      .step.active i {
        background: #d65632;
        color: white;
        border-color: #d65632;
      }
      .app {
        position: absolute;
        left: 403px;
        top: 180px;
        width: 1430px;
        height: 755px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #bcd0be;
        background: #f5f8f5;
        box-shadow: 0 24px 65px #173c2d15;
      }
      .app img {
        display: block;
        width: 1430px;
        max-width: none;
        transform-origin: 55% 32%;
      }
      .toplabel {
        position: absolute;
        left: 419px;
        top: 142px;
        font-size: 17px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: #698270;
      }
      .tag {
        display: inline-block;
        background: #e7eddc;
        border: 1px solid #c6d6b6;
        color: #34553a;
        border-radius: 30px;
        padding: 10px 18px;
        font-size: 18px;
      }
      .tag.coral {
        background: #fbe8dc;
        color: #ac492b;
        border-color: #eebfa9;
      }
      #caption {
        position: absolute;
        bottom: 32px;
        left: 310px;
        right: 310px;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }
      #caption span {
        display: inline-block;
        text-align: center;
        background: #132d24ed;
        color: #fff;
        padding: 13px 24px;
        border-radius: 12px;
        font-size: 28px;
        line-height: 1.3;
        max-width: 1270px;
        box-shadow: 0 4px 16px #0001;
      }
      #progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 5px;
        background: #df6a46;
      }
      .note {
        position: absolute;
        bottom: 20px;
        left: 24px;
        background: #173c2ded;
        color: #fff;
        border-radius: 22px;
        padding: 9px 15px;
        font-size: 16px;
      }
      .cursor {
        position: absolute;
        width: 36px;
        height: 44px;
        filter: drop-shadow(0 3px 4px #173c2d40);
      }
      .ring {
        position: absolute;
        width: 70px;
        height: 70px;
        border: 3px solid #e46943;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .node {
        position: absolute;
        width: 445px;
        height: 158px;
        border: 1px solid #bad0b5;
        border-radius: 18px;
        background: #fffdf6;
        padding: 27px 31px;
      }
      .node strong {
        font-size: 31px;
        font-weight: 700;
        letter-spacing: -1px;
        display: block;
      }
      .node small {
        font-size: 21px;
        color: #627568;
        display: block;
        margin-top: 10px;
      }
      .node em {
        position: absolute;
        right: 24px;
        top: 23px;
        font-style: normal;
        font-size: 15px;
        color: #83947e;
      }
      .node.hot {
        border: 2px solid #e87a52;
        background: #fff8e9;
      }
      .diagram-label {
        font-size: 18px;
        fill: #638274;
      }
      .pill {
        padding: 12px 23px;
        border: 1px solid #78947b;
        border-radius: 28px;
        display: inline-block;
        font-size: 22px;
      }
      .portrait {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #dfe9cf;
        display: grid;
        place-items: center;
        margin: auto;
      }
      .check {
        color: #173c2d;
        background: #ddecce;
        display: inline-block;
        border-radius: 24px;
        padding: 10px 20px;
        font-size: 22px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main id="film">
      <div id="stage"></div>
      <div id="caption"></div>
      <div id="progress"></div>
    </main>
    <script>
      const stage = document.querySelector('#stage'),
        caption = document.querySelector('#caption'),
        progress = document.querySelector('#progress');
      let timeline;
      const clamp = (n, a = 0, b = 1) => Math.max(a, Math.min(b, n));
      const ease = (n) => 1 - Math.pow(1 - clamp(n), 3);
      const reveal = (time, delay = 0) =>
        `opacity:${ease((time - delay) / 0.65)};transform:translateY(${24 * (1 - ease((time - delay) / 0.65))}px)`;
      const escape = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      function leaf(x, y, size, angle, color = '#adc98b') {
        return `<svg style="position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px;transform:rotate(${angle}deg)" viewBox="0 0 100 100"><path d="M14 86C-6 18 53 3 88 12C97 54 68 108 14 86Z" fill="${color}"/><path d="M13 88L77 23M37 65L35 29M54 47L76 50" fill="none" stroke="#173c2d" stroke-width="1.8" opacity=".35"/></svg>`;
      }
      function butterfly(x, y, t, size = 125) {
        const wing = 0.8 + 0.2 * Math.sin(t * 10);
        return `<svg style="position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px;transform:rotate(-12deg)" viewBox="0 0 120 100"><g transform="translate(60 50) scale(${wing} 1)"><path d="M-2 0C-16-58-65-42-53-11C-50 0-30 15-6 7C-27 3-54 23-32 38C-14 47-7 27-1 7" fill="#ed8c56" stroke="#173c2d" stroke-width="2"/><path d="M2 0C16-58 65-42 53-11C50 0 30 15 6 7C27 3 54 23 32 38C14 47 7 27 1 7" fill="#ed8c56" stroke="#173c2d" stroke-width="2"/><path d="M-5-4L-37-28M-5 5L-37-5M5-4L37-28M5 5L37-5" stroke="#173c2d" stroke-width="2" opacity=".6"/></g><path d="M60 28V77M60 31L50 17M60 31L70 17" stroke="#173c2d" stroke-width="4" stroke-linecap="round"/></svg>`;
      }
      function header(dark = false) {
        return `<div class="brand" style="${dark ? 'color:#f8f4e4' : ''}">wildmon<b>.</b></div><div class="edition" style="${dark ? 'color:#c8d9bf' : ''}">Your outdoor world, collected</div>`;
      }
      function pointer(x, y, time, clickAt) {
        const pulse = clamp((time - clickAt) / 0.8);
        return `<svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 36 44"><path d="M3 2L4 34L13 27L20 41L27 37L20 23L33 22Z" fill="#fffaf1" stroke="#173c2d" stroke-width="2"/></svg>${time > clickAt && pulse < 1 ? `<div class="ring" style="left:${x + 4}px;top:${y + 4}px;opacity:${1 - pulse};scale:${0.5 + pulse * 1.2}"></div>` : ''}`;
      }
      function app(src, options = {}) {
        return `<div class="toplabel">${options.label || 'Captured in Chrome · live local application'}</div><div class="app" style="${options.style || ''}"><img src="assets/${src}.png" style="transform:scale(${options.zoom || 1}) translate(${options.panX || 0}px,${options.panY || 0}px)">${options.note ? `<div class="note">${options.note}</div>` : ''}</div>`;
      }
      function rail(kicker, title, description, steps = [], active = 0, time = 1) {
        return `<aside class="rail" style="${reveal(time)}"><div class="eyebrow">${kicker}</div><h1 class="heading">${title}</h1><p class="body">${description}</p>${steps.map((s, i) => `<div class="step ${i === active ? 'active' : ''}"><i>${i + 1}</i>${s}</div>`).join('')}</aside>`;
      }
      function intro(t, d) {
        const landing = t > d * 0.64;
        if (landing)
          return `${header()}<div style="position:absolute;left:76px;top:153px;width:1768px;height:795px;overflow:hidden;border-radius:24px;border:1px solid #cad8c3"><img src="assets/landing.png" style="width:1768px;transform:translateY(${-16 - 9 * (t - d * 0.64)}px)"></div>`;
        return `<div style="position:absolute;inset:0;background:#173c2d"></div>${header(true)}<div style="position:absolute;left:120px;top:257px;color:#f8f4e4;${reveal(t, 0.2)}"><div class="eyebrow" style="color:#bfcea9">One photo. A whole world.</div><h1 style="font-size:136px;letter-spacing:-8px;line-height:.95;margin:28px 0">Step out.<br><span style="color:#f2926d">Look closer.</span></h1><p style="font-size:29px;color:#c9d7c0;margin-top:42px">A nature discovery game for the world around you.</p></div><div style="position:absolute;left:1102px;top:188px;width:650px;height:650px;border-radius:50%;overflow:hidden;border:16px solid #577247;transform:scale(${0.96 + 0.04 * ease(t / 3)})"><img src="assets/hero.jpg" style="width:100%;height:100%;object-fit:cover;transform:scale(${1 + t * 0.006})"></div>${leaf(1004, 634, 240, -30 + Math.sin(t) * 3)}${leaf(1610, 170, 180, 80 - Math.sin(t) * 4, '#d0d9a6')}${butterfly(943 + 24 * t, 215 + 25 * Math.sin(t * 1.2), t, 140)}`;
      }
      function captureScene(t, d) {
        const p = t / d;
        const src = p < 0.17 ? 'capture' : p < 0.48 ? 'capture-preview' : 'collection';
        const note =
          p >= 0.48
            ? 'Earlier verified discoveries · genuine processed results'
            : p >= 0.17
              ? 'Photo preview · image not resubmitted for this recording'
              : '';
        let html =
          header() +
          rail(
            '01 / Discover',
            'A moment.<br>A discovery.',
            'One organism.<br>One clear photo.',
            ['Choose photo', 'Submit & explore', 'Return to results'],
            p < 0.17 ? 0 : p < 0.48 ? 1 : 2,
            t,
          );
        html += app(src, {
          note,
          zoom: p >= 0.72 ? 1.24 : 1,
          panX: p >= 0.72 ? 80 : 0,
          panY: p >= 0.72 ? 75 : 0,
        });
        if (p < 0.48) html += pointer(1025, 780, t, d * 0.18);
        if (p >= 0.48)
          html += `<div style="position:absolute;left:93px;top:796px;${reveal(t, d * 0.48)}"><span class="tag coral">Real photos. Real results.</span></div>`;
        return html;
      }
      function hunt(t, d) {
        const p = t / d,
          src = p < 0.36 ? 'hunt-setup' : p < 0.76 ? 'hunt-active' : 'hunt-summary';
        const active = p < 0.36 ? 0 : p < 0.76 ? 1 : 2;
        return (
          header() +
          rail(
            '02 / Free hunt',
            'Make time<br>for outside.',
            'A timer for your walk.<br>A reveal when you return.',
            ['Pick a duration', 'Start & explore', 'Finish & reveal'],
            active,
            t,
          ) +
          app(src, {
            note:
              p >= 0.76 ? 'Short demo session · no photos submitted · zero rewards invented' : '',
          }) +
          (p < 0.36 ? pointer(900, 615, t, d * 0.3) : '')
        );
      }
      function challenge(t, d) {
        if (t / d < 0.43)
          return (
            header() +
            rail(
              '03 / Together',
              'Same targets.<br>Shared clock.',
              'Choose supported categories and visible traits.',
              [],
              0,
              t,
            ) +
            app('challenge-builder', { note: 'Live challenge builder · no invitation sent' })
          );
        const u = t - d * 0.43;
        const start = 2.5;
        const ready1 = u > 0.7,
          ready2 = u > 2.1,
          live = u > start;
        return `${header()}<div style="position:absolute;left:95px;top:163px"><div class="eyebrow">Challenge mechanics · animated explanation</div><h1 class="heading">Ready together. Start together.</h1><p class="body">The server gives both explorers the same start and deadline.</p></div><svg style="position:absolute;left:0;top:0;width:1920px;height:1080px"><path d="M520 569H785M1135 569H1400" fill="none" stroke="#a7bb9d" stroke-width="3" stroke-dasharray="9 9"/><circle cx="${live ? 785 + 350 * clamp((u - start) / 1.2) : 690}" cy="569" r="9" fill="#dd6e46" opacity="${live ? 1 : 0}"/></svg><div style="position:absolute;left:308px;top:392px;width:400px;text-align:center;${reveal(u)}"><div class="portrait"><svg width="62" height="62" viewBox="0 0 64 64"><circle cx="32" cy="20" r="11" fill="#53764b"/><path d="M10 58C10 31 54 31 54 58" fill="#53764b"/></svg></div><h2 style="font-size:33px">Explorer one</h2><div class="check">${ready1 ? '✓ Ready' : 'Waiting'}</div></div><div style="position:absolute;left:786px;top:423px;width:348px;height:270px;border-radius:30px;background:#173c2d;color:#fff7e8;text-align:center;padding:38px 25px"><div style="font-size:19px;letter-spacing:2px;text-transform:uppercase;color:#c5d9b4">One shared clock</div><strong style="font-size:68px;display:block;margin-top:25px;letter-spacing:-3px">${live ? '20:00' : '— : —'}</strong><div style="font-size:21px;color:#ed976e;margin-top:12px">${live ? 'Both ready → server starts' : 'Waiting for both players'}</div></div><div style="position:absolute;left:1212px;top:392px;width:400px;text-align:center;${reveal(u, 0.3)}"><div class="portrait" style="background:#f6dbc0"><svg width="62" height="62" viewBox="0 0 64 64"><circle cx="32" cy="20" r="11" fill="#ba6543"/><path d="M10 58C10 31 54 31 54 58" fill="#ba6543"/></svg></div><h2 style="font-size:33px">Explorer two</h2><div class="check">${ready2 ? '✓ Ready' : 'Waiting'}</div></div><div style="position:absolute;left:560px;top:795px;display:flex;gap:18px"><span class="pill">Same requirements</span><span class="pill">Verified evidence</span><span class="pill">Server decides</span></div>`;
      }
      function ecosystem(t, d) {
        const p = t / d;
        return (
          header() +
          rail(
            '04 / Ecosystems',
            'A little more.<br>Every day.',
            'A lasting checklist for the living world around you.',
            [],
            0,
            t,
          ) +
          app(p < 0.27 ? 'ecosystems' : 'ecosystem-detail', {
            note: p >= 0.27 ? 'Real pack requirements · progress shown as recorded' : '',
          }) +
          `<div style="position:absolute;left:82px;top:673px;${reveal(t, 1)}"><span class="tag">Progress across days</span><br><span class="tag" style="margin-top:12px">Earlier evidence can count</span></div>${leaf(60, 808, 118, 20 + Math.sin(t) * 5, '#c3d2a5')}`
        );
      }
      function rewards(t, d) {
        const p = t / d;
        return (
          header() +
          rail(
            '05 / Progress',
            'Notice more.<br>Grow your world.',
            'Badges, collection, and eligible experience points.',
            [],
            0,
            t,
          ) +
          app(p < 0.47 ? 'badges' : p < 0.74 ? 'leaderboard' : 'leaderboard-alltime', {
            note: 'Actual account state · server-awarded XP',
          }) +
          `<div style="position:absolute;left:83px;top:723px"><span class="tag coral">Weekly + all time</span></div>`
        );
      }
      function architecture(t, d) {
        const nodes = [
          ['Next.js', 'Website · Radix + Tailwind', 90, 340],
          ['FastAPI', 'Authentication · Pydantic', 738, 340],
          ['MongoDB Atlas', 'Discoveries · durable job queue', 1386, 340],
          ['Python worker', 'Leases · retries · job processing', 1386, 650],
          ['Gemma vision', 'Image identification · LangChain', 738, 650],
          ['Validated discovery', 'Collection · one-time XP rewards', 90, 650],
        ];
        const p = clamp(t / (d * 0.78));
        const active = Math.min(5, Math.floor(p * 6));
        const paths = [
          'M535 419H738',
          'M1183 419H1386',
          'M1608 498V650',
          'M1386 729H1183',
          'M738 729H535',
        ];
        let html = `${header()}<div style="position:absolute;left:95px;top:153px;${reveal(t)}"><div class="eyebrow">06 / Under the canopy</div><h1 class="heading">A photo becomes a discovery.</h1><p class="body">A durable queue keeps identification running after the browser closes.</p></div><svg width="1920" height="1080" style="position:absolute;inset:0">${paths.map((path, i) => `<path d="${path}" fill="none" stroke="${active > i ? '#dd794e' : '#b4c8a8'}" stroke-width="3" stroke-dasharray="8 9" stroke-dashoffset="${-t * 20}"/>`).join('')}</svg>`;
        html += nodes
          .map(
            ([title, detail, x, y], i) =>
              `<div class="node ${i === active ? 'hot' : ''}" style="left:${x}px;top:${y}px;${reveal(t, i * 0.22)}"><em>0${i + 1}</em><strong>${title}</strong><small>${detail}</small></div>`,
          )
          .join('');
        html += `<div style="position:absolute;left:97px;top:860px;display:flex;gap:18px;${reveal(t, 3)}"><span class="pill">AI uncertainty stays visible</span><span class="pill">Rules and scoring live on the server</span><span class="pill">Background processing</span></div>`;
        return html;
      }
      function outro(t, d) {
        return `<div style="position:absolute;inset:0;background:#173c2d"></div>${header(true)}${leaf(135, 590, 280, 30 + Math.sin(t) * 3)}${leaf(1530, 226, 235, -35 + Math.sin(t) * 3, '#c6d8a8')}${butterfly(1290 + Math.sin(t) * 40, 340 + Math.cos(t) * 25, t, 155)}<div style="position:absolute;left:350px;right:350px;top:307px;text-align:center;color:#f7f3e5;${reveal(t)}"><div style="font-size:32px;color:#cadbb8;margin-bottom:30px">A quick photo. A shared adventure.</div><h1 style="font-size:151px;letter-spacing:-9px;margin:0">wildmon<span style="color:#ed8c66">.</span></h1><p style="font-size:53px;letter-spacing:-2px;margin-top:22px">Find more outside.</p></div>`;
      }
      const scenes = {
        intro,
        capture: captureScene,
        hunt,
        challenge,
        ecosystem,
        rewards,
        architecture,
        outro,
      };
      window.renderAt = function (time) {
        const index = Math.max(
          0,
          timeline.scenes.findIndex(
            (s, i) => time >= s.start && (time < s.end || i === timeline.scenes.length - 1),
          ),
        );
        const scene = timeline.scenes[index],
          local = time - scene.start,
          duration = scene.end - scene.start;
        let html = scenes[scene.id](local, duration);
        // A quick cream wipe gives each chapter a clean, deterministic transition.
        const fade = clamp(local / 0.35);
        stage.innerHTML = `<section class="layer" style="opacity:${fade}">${html}</section>`;
        const cue = timeline.captions.find((c) => time >= c.start && time < c.end);
        caption.innerHTML = cue ? `<span>${escape(cue.text)}</span>` : '';
        progress.style.width = `${100 * clamp(time / timeline.duration)}%`;
      };
      window.ready = (async () => {
        timeline = await (await fetch('timeline.json')).json();
        const assets = [
          'landing',
          'dashboard',
          'collection',
          'capture',
          'capture-preview',
          'hunt-setup',
          'hunt-active',
          'hunt-summary',
          'challenge-builder',
          'ecosystems',
          'ecosystem-detail',
          'badges',
          'leaderboard',
          'leaderboard-alltime',
        ];
        await Promise.all(
          assets.map(
            (name) =>
              new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = resolve;
                img.onerror = () => reject(new Error('Missing capture ' + name));
                img.src = `assets/${name}.png`;
              }),
          ),
        );
        await document.fonts.ready;
        window.renderAt(0);
        return true;
      })();
      window.play = function () {
        const start = performance.now();
        function tick() {
          const t = (performance.now() - start) / 1000;
          window.renderAt(Math.min(t, timeline.duration - 0.01));
          if (t < timeline.duration) requestAnimationFrame(tick);
        }
        tick();
      };
    </script>
  </body>
</html>
